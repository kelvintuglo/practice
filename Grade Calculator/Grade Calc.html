<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Grade Calc.css">
    <title>Grade Calculator</title>
  </head>
  <body>
    <h1>Grade Calculator</h1>

    <div id="container">
      <label for="test1">Test 1</label> <br>
      <input id="test1" type="text" placeholder="enter test 1 score"> <br><br>

      <label for="test2">Test 2</label> <br>
      <input id="test2" type="text" placeholder="enter test 2 score"> <br><br>

      <label for="exam-score">Exam Score</label> <br>
      <input id="exam-score" type="text" placeholder="enter exam score"><br>

      <p id="total-score"></p>
      <p id="text"></p>
      <!-- <p id="letter-grade"></p> -->
      <p id="remarks"></p>

      <button id="submit">Submit</button>
    </div>

    <script src="Grade calc.js"></script>
  </body>
</html>
